name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages metadata
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: TypeScript and Astro check
        run: npm run check

      - name: Build site and PDF exports
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify pages and exports
        run: npm run verify
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: tmp/qa
          if-no-files-found: ignore
